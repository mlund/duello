name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push supersedes a running PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Run clippy
      run: cargo clippy --all-targets --no-deps
    # duello-web builds without the CLI feature.
    - name: Run clippy without default features
      run: cargo clippy --all-targets --no-deps --no-default-features
    # Unoptimised float code makes the scan tests take minutes instead of seconds.
    - name: Run tests
      run: cargo test --release
